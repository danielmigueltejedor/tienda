# SonarCloud automatic analysis settings.
#
# build-aux/flatpak/flatpak-builder-tools is a vendored git submodule that is
# only used at packaging time. src/style.css is GTK CSS: shade(), the "row"
# node name and currentColor are valid there, but the generic CSS analyser
# reports every one of them as unknown.
sonar.exclusions=build-aux/flatpak/flatpak-builder-tools/**,src/style.css
