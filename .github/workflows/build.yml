name: build

on:
  push:
    branches: [main, nodalix/store]
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    # Nodalix OS is Arch Linux: build the store against the same libraries it ships with.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git meson ninja vala blueprint-compiler gettext libxml2 \
            desktop-file-utils appstream gtk4 libadwaita libdex flatpak libxmlb libyaml libsoup3 \
            json-glib glycin glycin-gtk4 webkitgtk-6.0 libsecret libproxy malcontent \
            gtksourceview5 md4c systemd-libs dbus python python-babel perl glib2-devel
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check the vendored NDL sheets match the pinned upstream commit
        run: |
          cd src/ndl
          sha256sum -c SHA256SUMS
          # Every sheet must be listed, so dropping an entry cannot hide an edit.
          test "$(ls nodalia-*.css | wc -l)" = "$(awk '{print $2}' SHA256SUMS | grep -c '^nodalia-.*\.css$')"
          commit=$(grep -oE '[0-9a-f]{40}' PROVENANCE.md | head -n 1)
          for sheet in nodalia-*.css; do
            curl --proto "=https" --tlsv1.2 -fsSL "https://raw.githubusercontent.com/danielmigueltejedor/nodalia-design/$commit/packages/gtk/crate/src/css/$sheet" | cmp - "$sheet"
          done
      - run: meson setup build --prefix=/usr
      - run: meson compile -C build
      - name: Install into a staging directory and validate the metadata
        run: |
          DESTDIR="$PWD/stage" meson install -C build
          desktop-file-validate stage/usr/share/applications/os.nodalix.Store.desktop
          appstreamcli validate --no-net stage/usr/share/metainfo/os.nodalix.Store.metainfo.xml
          test -x stage/usr/bin/nodalix-store
          test -x stage/usr/bin/nodalix-store-daemon
